[tool.poetry]
name = "pipeline-core"
version = "1.0.0"
description = "Enterprise Legacy Modernization Factory - Core Graph, Cognitive Agents, and Hand-Off Receipts Engine"
authors = ["Enterprise Modernization Team <devops@enterprise.com>"]
readme = "README.md"
packages = [{include = "pipeline_core"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
neo4j = "^5.18.0"
requests = "^2.31.0"
jinja2 = "^3.1.3"
click = "^8.1.7"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-cov = "^4.1.0"
black = "^24.3.0"
ruff = "^0.3.4"
mypy = "^1.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
